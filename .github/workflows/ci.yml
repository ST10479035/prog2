name: RaceDayAPI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore RaceDayAPI.sln

    - name: Build Solution
      run: dotnet build RaceDayAPI.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test RaceDayAPI.sln --configuration Release --no-build --verbosity normal
